{% extends "base.html" %}

{% block title %}Login | CampusConnect{% endblock %}

{% block content %}
<section class="form-section">
    <div class="form-card">
        <p class="eyebrow">Welcome back</p>
        <h1>Log in to CampusConnect</h1>
        <p class="form-intro">Enter your account information to open your role-based dashboard.</p>

        <form method="POST" action="{{ url_for('login') }}">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>

            <button type="submit">Log In</button>
        </form>

        <p class="form-switch">
            Need an account? <a href="{{ url_for('register') }}">Register</a>
        </p>
    </div>
</section>
{% endblock %}
